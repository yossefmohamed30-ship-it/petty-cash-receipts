<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --g:#3d8b40; --g2:#e8f3e8; --bd:#dadce0; --tx:#202124; --mu:#5f6368; --rd:#c5221f; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; margin:0; padding:14px; color:var(--tx); background:#fff; max-width:480px; margin-inline:auto; }
  h2 { margin:0 0 12px; font-size:18px; }
  label { display:block; font-size:13px; color:var(--mu); margin:12px 0 4px; }
  select, input, textarea { width:100%; padding:10px; font-size:15px; border:1px solid var(--bd); border-radius:8px; font-family:inherit; }
  textarea { resize:vertical; min-height:70px; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--g); border-color:transparent; }
  .drop { margin-top:12px; border:2px dashed var(--g); border-radius:12px; background:var(--g2); padding:26px 12px; text-align:center; cursor:pointer; font-size:16px; color:var(--g); font-weight:600; }
  .drop.over { background:#d4ead4; }
  .drop small { display:block; font-weight:400; color:var(--mu); margin-top:6px; font-size:12px; }
  #preview { width:100%; max-height:260px; object-fit:contain; border-radius:10px; border:1px solid var(--bd); margin-top:12px; display:none; background:#fafafa; }
  .status { margin-top:12px; padding:10px; border-radius:8px; font-size:14px; display:none; }
  .status.info { display:block; background:#e8f0fe; color:#1a4fa0; }
  .status.ok { display:block; background:var(--g2); color:var(--g); }
  .status.err { display:block; background:#fce8e6; color:var(--rd); }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:s .7s linear infinite; vertical-align:-2px; margin-left:6px; }
  @keyframes s { to { transform:rotate(360deg); } }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .seg { display:flex; border:1px solid var(--bd); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:0; background:#fff; padding:10px; font-size:14px; cursor:pointer; font-family:inherit; }
  .seg button.on.out { background:#fce8e6; color:var(--rd); font-weight:700; }
  .seg button.on.in { background:var(--g2); color:var(--g); font-weight:700; }
  .amount { font-size:22px; font-weight:700; text-align:center; direction:ltr; }
  .btns { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; padding:12px; font-size:16px; border-radius:8px; border:0; cursor:pointer; font-family:inherit; font-weight:600; }
  .btn.pri { background:var(--g); color:#fff; flex:2; }
  .btn.sec { background:#f1f3f4; color:var(--tx); }
  .btn:disabled { opacity:.5; cursor:default; }
  .hint { font-size:12px; color:var(--mu); margin-top:4px; }
  #form { display:none; }
  a { color:var(--g); }
</style>
</head>
<body>
  <h2>🧾 إضافة إيصال</h2>

  <label>التاب</label>
  <select id="sheet"><option>...</option></select>

  <div class="drop" id="drop">
    📷 ارفع صورة الإيصال
    <small>اضغط أو اسحب الصورة هنا (صورة أو PDF)</small>
  </div>
  <input type="file" id="file" accept="image/*,application/pdf" hidden>

  <img id="preview" alt="">
  <div class="status" id="status"></div>

  <div id="form">
    <label>المبلغ</label>
    <input id="amount" class="amount" type="number" step="0.01" inputmode="decimal">
    <div class="hint" id="aiHint"></div>

    <label>النوع</label>
    <div class="seg">
      <button type="button" class="out on" data-t="out">⬇️ صرف</button>
      <button type="button" class="in" data-t="in">⬆️ وارد</button>
    </div>

    <label>التاريخ</label>
    <input id="date" type="date">

    <label>صرفته في إيه؟</label>
    <textarea id="desc" placeholder="اكتب الوصف..."></textarea>

    <div class="btns">
      <button class="btn sec" id="cancel">إلغاء</button>
      <button class="btn pri" id="done">✅ Done</button>
    </div>
  </div>

<script>
  const DEFAULT_SHEET = <?= JSON.stringify(defaultSheet) ?>;
  const $ = id => document.getElementById(id);
  let upload = null;     // { fileId, url, ... }
  let type = 'out';

  // ---------- التابات ----------
  google.script.run.withSuccessHandler(list => {
    let saved = '';
    try { saved = localStorage.getItem('pc_sheet') || ''; } catch (e) {}
    const pick = DEFAULT_SHEET && list.includes(DEFAULT_SHEET) ? DEFAULT_SHEET : (list.includes(saved) ? saved : list[0]);
    $('sheet').innerHTML = list.map(n => `<option ${n === pick ? 'selected' : ''}>${n}</option>`).join('');
  }).withFailureHandler(err => status('err', err.message)).getSheetsList();

  $('sheet').onchange = () => { try { localStorage.setItem('pc_sheet', $('sheet').value); } catch (e) {} };

  // ---------- رفع الصورة ----------
  const drop = $('drop');
  drop.onclick = () => $('file').click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
  $('file').onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); e.target.value = ''; };
  document.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) handleFile(item.getAsFile());
  });

  async function handleFile(file) {
    if (upload) discard();
    resetForm();
    drop.style.display = 'none';
    status('info', 'بيرفع الصورة ويحللها...<span class="spin"></span>');

    let payload;
    try {
      payload = file.type === 'application/pdf' ? await readRaw(file) : await compress(file);
    } catch (e) {
      payload = await readRaw(file);
    }
    if (payload.mimeType.startsWith('image/')) {
      $('preview').src = 'data:' + payload.mimeType + ';base64,' + payload.base64;
      $('preview').style.display = 'block';
    }

    google.script.run
      .withSuccessHandler(res => {
        upload = res;
        showForm(res);
      })
      .withFailureHandler(err => {
        status('err', '❌ ' + err.message);
        drop.style.display = 'block';
      })
      .uploadAndAnalyze(payload);
  }

  function readRaw(file) {
    return new Promise((ok, fail) => {
      const r = new FileReader();
      r.onload = () => ok({ base64: r.result.split(',')[1], mimeType: file.type || 'image/jpeg', fileName: file.name || 'receipt' });
      r.onerror = fail;
      r.readAsDataURL(file);
    });
  }

  // تصغير الصورة قبل الرفع (أسرع وأوفر)
  function compress(file, max = 1600) {
    return new Promise((ok, fail) => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const name = (file.name || 'receipt').replace(/\.[^.]+$/, '') + '.jpg';
        ok({ base64: c.toDataURL('image/jpeg', 0.85).split(',')[1], mimeType: 'image/jpeg', fileName: name });
        URL.revokeObjectURL(img.src);
      };
      img.onerror = fail;
      img.src = URL.createObjectURL(file);
    });
  }

  // ---------- الفورم ----------
  function showForm(res) {
    $('form').style.display = 'block';
    $('date').value = res.date || today();
    $('amount').value = res.amount != null ? Math.abs(res.amount) : '';
    setType(res.type || 'out');

    if (res.aiError) {
      status('err', '⚠️ الصورة اترفعت بس التحليل فشل — اكتب المبلغ بنفسك<br><small>' + res.aiError + '</small>');
      $('aiHint').textContent = '';
      $('amount').focus();
      return;
    }
    status('ok', `✅ اترفعت — <a href="${res.url}" target="_blank">فتح الإيصال</a>`);
    $('aiHint').textContent = [res.merchant, res.summary].filter(Boolean).join(' — ');
    if (res.summary) $('desc').placeholder = res.summary;
    res.amount != null ? $('desc').focus() : $('amount').focus();
  }

  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setType(b.dataset.t));
  function setType(t) {
    type = t;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  }

  $('desc').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
  });
  $('done').onclick = save;
  $('cancel').onclick = () => { discard(); resetAll(); };

  function save() {
    const amount = parseFloat($('amount').value);
    const description = $('desc').value.trim() || $('desc').placeholder.replace('اكتب الوصف...', '').trim();
    if (!amount) { status('err', 'اكتب المبلغ'); $('amount').focus(); return; }
    if (!description) { status('err', 'اكتب صرفته في إيه'); $('desc').focus(); return; }
    if (!$('date').value) { status('err', 'اختار التاريخ'); return; }

    $('done').disabled = $('cancel').disabled = true;
    status('info', 'بيسجل في الشيت...<span class="spin"></span>');

    google.script.run
      .withSuccessHandler(r => {
        const sign = type === 'in' ? '+' : '-';
        upload = null;
        resetAll();
        status('ok', `✅ اتسجل في "${r.sheet}" صف ${r.row} (${sign}${amount}) — ارفع الإيصال اللي بعده 👇`);
      })
      .withFailureHandler(err => {
        $('done').disabled = $('cancel').disabled = false;
        status('err', '❌ ' + err.message);
      })
      .saveEntry({
        sheetName: $('sheet').value,
        date: $('date').value,
        amount, type, description,
        url: upload.url, fileId: upload.fileId,
      });
  }

  function discard() {
    if (upload && upload.fileId) google.script.run.discardUpload(upload.fileId);
    upload = null;
  }

  function resetForm() {
    $('form').style.display = 'none';
    $('amount').value = ''; $('desc').value = ''; $('desc').placeholder = 'اكتب الوصف...';
    $('aiHint').textContent = '';
    $('done').disabled = $('cancel').disabled = false;
  }
  function resetAll() {
    resetForm();
    $('preview').style.display = 'none'; $('preview').src = '';
    $('status').className = 'status';
    drop.style.display = 'block';
  }

  function status(kind, html) { const s = $('status'); s.className = 'status ' + kind; s.innerHTML = html; }
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
</script>
</body>
</html>
