<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>إضافة إيصال</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --g:#3d8b40; --g2:#e8f3e8; --bd:#dadce0; --tx:#202124; --mu:#5f6368; --rd:#c5221f; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; margin:0; padding:14px; color:var(--tx); background:#fff; max-width:480px; margin-inline:auto; }
  h2 { margin:0 0 12px; font-size:18px; }
  label { display:block; font-size:13px; color:var(--mu); margin:12px 0 4px; }
  select, input, textarea { width:100%; padding:10px; font-size:15px; border:1px solid var(--bd); border-radius:8px; font-family:inherit; }
  textarea { resize:vertical; min-height:70px; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--g); border-color:transparent; }
  .drop { margin-top:12px; border:2px dashed var(--g); border-radius:12px; background:var(--g2); padding:26px 12px; text-align:center; cursor:pointer; font-size:16px; color:var(--g); font-weight:600; }
  .drop.over { background:#d4ead4; }
  .drop small { display:block; font-weight:400; color:var(--mu); margin-top:6px; font-size:12px; }
  #preview { width:100%; max-height:260px; object-fit:contain; border-radius:10px; border:1px solid var(--bd); margin-top:12px; display:none; background:#fafafa; }
  .status { margin-top:12px; padding:10px; border-radius:8px; font-size:14px; display:none; }
  .status.info { display:block; background:#e8f0fe; color:#1a4fa0; }
  .status.ok { display:block; background:var(--g2); color:var(--g); }
  .status.err { display:block; background:#fce8e6; color:var(--rd); }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:s .7s linear infinite; vertical-align:-2px; margin-left:6px; }
  @keyframes s { to { transform:rotate(360deg); } }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .seg { display:flex; border:1px solid var(--bd); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:0; background:#fff; padding:10px; font-size:14px; cursor:pointer; font-family:inherit; }
  .seg button.on.out { background:#fce8e6; color:var(--rd); font-weight:700; }
  .seg button.on.in { background:var(--g2); color:var(--g); font-weight:700; }
  .amount { font-size:22px; font-weight:700; text-align:center; direction:ltr; }
  .btns { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; padding:12px; font-size:16px; border-radius:8px; border:0; cursor:pointer; font-family:inherit; font-weight:600; }
  .btn.pri { background:var(--g); color:#fff; flex:2; }
  .btn.sec { background:#f1f3f4; color:var(--tx); }
  .btn:disabled { opacity:.5; cursor:default; }
  .hint { font-size:12px; color:var(--mu); margin-top:4px; }
  #form { display:none; }
  a { color:var(--g); }
  .progress { display:none; justify-content:space-between; align-items:center; margin-top:12px; font-weight:700; font-size:15px; }
  .link { border:0; background:none; color:var(--g); font-size:14px; cursor:pointer; font-family:inherit; font-weight:600; }
  .strip { display:none; gap:6px; overflow-x:auto; margin-top:8px; padding-bottom:4px; }
  .th { position:relative; flex:0 0 52px; height:52px; border-radius:8px; border:2px solid var(--bd); overflow:hidden; cursor:pointer; background:#fafafa; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .th img { width:100%; height:100%; object-fit:cover; }
  .th.cur { border-color:var(--g); }
  .th.saved, .th.skipped { opacity:.45; }
  .th b { position:absolute; bottom:1px; left:2px; font-size:13px; }
</style>
</head>
<body>
  <h2>🧾 إضافة إيصال</h2>

  <label>التاب</label>
  <select id="sheet"><option>...</option></select>

  <div class="drop" id="drop">
    📷 ارفع صور الإيصالات
    <small>تقدر تختار صورة واحدة أو كذا صورة مع بعض</small>
  </div>
  <input type="file" id="file" accept="image/*,application/pdf" multiple hidden>

  <div id="progress" class="progress"><span></span><button type="button" id="more" class="link">➕ صور تانية</button></div>
  <div id="strip" class="strip"></div>
  <img id="preview" alt="">
  <div class="status" id="status"></div>

  <div id="form">
    <label>المبلغ</label>
    <input id="amount" class="amount" type="number" step="0.01" inputmode="decimal">
    <div class="hint" id="aiHint"></div>

    <label>النوع</label>
    <div class="seg">
      <button type="button" class="out on" data-t="out">⬇️ صرف</button>
      <button type="button" class="in" data-t="in">⬆️ وارد</button>
    </div>

    <label>التاريخ</label>
    <input id="date" type="date">

    <label>صرفته في إيه؟</label>
    <textarea id="desc" placeholder="اكتب الوصف..."></textarea>

    <div class="btns">
      <button class="btn sec" id="cancel">تخطّي ✖️</button>
      <button class="btn pri" id="done">✅ Done</button>
    </div>
  </div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbxV7D1TN-gh0nSpTD9XXoJwTFSe_bHAImQELxOl_8vKhKSxITX9fq34ZTgklOMyEn7Q/exec';
  const $ = id => document.getElementById(id);
  let KEY = new URLSearchParams(location.search).get('k') || '';
  try { if (KEY) localStorage.setItem('pc_key', KEY); else KEY = localStorage.getItem('pc_key') || ''; } catch (e) {}

  // الطابور: كل صورة = { thumb, payload, state: 'wait'|'busy'|'ready'|'error'|'saved'|'skipped', res, err }
  let queue = [];
  let cur = -1;          // الصورة المعروضة دلوقتي
  let type = 'out';
  let saving = false;

  async function api(action, payload) {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, k: KEY }, payload || {})) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'حصل خطأ');
    return j.result;
  }

  // ---------- التابات ----------
  if (!KEY) status('err', '⛔ افتح الصفحة من اللينك الكامل اللي فيه المفتاح');
  else api('rcpt_sheets').then(list => {
    let saved = '';
    try { saved = localStorage.getItem('pc_sheet') || ''; } catch (e) {}
    const pick = list.includes(saved) ? saved : list[0];
    $('sheet').innerHTML = list.map(n => `<option ${n === pick ? 'selected' : ''}>${n}</option>`).join('');
  }).catch(err => status('err', '❌ ' + err.message));

  $('sheet').onchange = () => { try { localStorage.setItem('pc_sheet', $('sheet').value); } catch (e) {} };

  // ---------- اختيار الصور ----------
  const drop = $('drop');
  drop.onclick = () => $('file').click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); };
  $('file').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
  $('more').onclick = () => $('file').click();
  document.addEventListener('paste', e => {
    const files = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile());
    if (files.length) addFiles(files);
  });

  async function addFiles(files) {
    files = files.filter(f => f && (f.type.startsWith('image/') || f.type === 'application/pdf'));
    if (!files.length) return;
    drop.style.display = 'none';
    for (const file of files) {
      let payload;
      try { payload = file.type === 'application/pdf' ? await readRaw(file) : await compress(file); }
      catch (e) { payload = await readRaw(file); }
      queue.push({
        payload: payload,
        thumb: payload.mimeType.startsWith('image/') ? 'data:' + payload.mimeType + ';base64,' + payload.base64 : '',
        state: 'wait',
      });
    }
    renderStrip();
    pump();
    if (cur === -1 || isDone(queue[cur])) next();
  }

  // بيرفع ويحلل في الخلفية — واحدة ورا التانية، ولو فشلت بيحاول تاني لوحده
  let running = 0;
  function pump() {
    if (running) return;
    const item = queue.find(q => q.state === 'wait');
    if (!item) return;
    item.state = 'busy'; running = 1;
    api('rcpt_upload', item.payload)
      .then(res => { item.res = res; item.state = 'ready'; item.payload = null; })
      .catch(err => {
        item.tries = (item.tries || 0) + 1;
        if (item.tries < 3) { item.state = 'wait'; }
        else { item.err = err.message; item.state = 'error'; }
      })
      .finally(() => {
        running = 0;
        renderStrip();
        if (queue[cur] === item) show();
        setTimeout(pump, item.state === 'wait' ? 2500 : 0);
      });
  }

  function isDone(q) { return q && (q.state === 'saved' || q.state === 'skipped'); }

  function next() {
    const i = queue.findIndex(q => !isDone(q));
    cur = i;
    if (i === -1) { finishAll(); return; }
    show();
  }

  function show() {
    const item = queue[cur];
    renderStrip();
    $('progress').style.display = 'flex';
    $('progress').firstElementChild.textContent = `إيصال ${cur + 1} من ${queue.length}`;
    if (item.thumb) { $('preview').src = item.thumb; $('preview').style.display = 'block'; }
    else $('preview').style.display = 'none';

    if (item.state === 'wait' || item.state === 'busy') {
      $('form').style.display = 'none';
      status('info', 'بيرفع الصورة ويحللها...<span class="spin"></span>');
      return;
    }
    if (item.state === 'error') {
      $('form').style.display = 'none';
      status('err', '❌ الصورة دي ما اترفعتش: ' + item.err + ' <br><small>(اتجربت 3 مرات)</small><br><button class="btn sec" style="margin-top:8px" onclick="retry()">🔄 جرّب تاني</button> <button class="btn sec" style="margin-top:8px" onclick="skip()">تخطّي</button>');
      return;
    }
    fillForm(item.res);
  }

  function fillForm(res) {
    $('form').style.display = 'block';
    $('desc').value = ''; $('desc').placeholder = 'اكتب الوصف...';
    $('done').disabled = $('cancel').disabled = false;
    $('date').value = res.date || today();
    $('amount').value = res.amount != null ? Math.abs(res.amount) : '';
    setType(res.type || 'out');
    if (res.aiError) {
      status('err', '⚠️ الصورة اترفعت بس التحليل فشل — اكتب المبلغ بنفسك');
      $('aiHint').textContent = '';
      $('amount').focus();
      return;
    }
    status('ok', `✅ اترفعت — <a href="${res.url}" target="_blank">فتح الإيصال</a>`);
    $('aiHint').textContent = [res.merchant, res.summary].filter(Boolean).join(' — ');
    if (res.summary) $('desc').placeholder = res.summary;
    res.amount != null ? $('desc').focus() : $('amount').focus();
  }

  window.retry = () => { const it = queue[cur]; it.state = 'wait'; it.err = null; it.tries = 0; pump(); show(); };
  window.skip = () => { queue[cur].state = 'skipped'; next(); };

  // ---------- شريط الصور الصغيرة ----------
  function renderStrip() {
    const icons = { wait: '⏳', busy: '⏳', ready: '', error: '⚠️', saved: '✅', skipped: '✖️' };
    $('strip').innerHTML = queue.map((q, i) =>
      `<div class="th ${i === cur ? 'cur' : ''} ${q.state}" data-i="${i}">` +
      (q.thumb ? `<img src="${q.thumb}">` : '<span>PDF</span>') +
      (icons[q.state] ? `<b>${icons[q.state]}</b>` : '') + '</div>').join('');
    $('strip').style.display = queue.length > 1 ? 'flex' : 'none';
    $('strip').querySelectorAll('.th').forEach(el => el.onclick = () => {
      const i = +el.dataset.i;
      if (!isDone(queue[i]) && !saving) { cur = i; show(); }
    });
  }

  function readRaw(file) {
    return new Promise((ok, fail) => {
      const r = new FileReader();
      r.onload = () => ok({ base64: r.result.split(',')[1], mimeType: file.type || 'image/jpeg', fileName: file.name || 'receipt' });
      r.onerror = fail;
      r.readAsDataURL(file);
    });
  }

  // تصغير الصورة قبل الرفع (أسرع وأوفر)
  function compress(file, max = 1600) {
    return new Promise((ok, fail) => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const name = (file.name || 'receipt').replace(/\.[^.]+$/, '') + '.jpg';
        ok({ base64: c.toDataURL('image/jpeg', 0.85).split(',')[1], mimeType: 'image/jpeg', fileName: name });
        URL.revokeObjectURL(img.src);
      };
      img.onerror = fail;
      img.src = URL.createObjectURL(file);
    });
  }

  // ---------- الفورم ----------
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setType(b.dataset.t));
  function setType(t) {
    type = t;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  }

  $('desc').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
  });
  $('done').onclick = save;
  $('cancel').onclick = () => {
    const item = queue[cur];
    if (item && item.res && item.res.fileId) api('rcpt_discard', { fileId: item.res.fileId }).catch(() => {});
    item.state = 'skipped';
    next();
  };

  function save() {
    const item = queue[cur];
    if (!item || item.state !== 'ready' || saving) return;
    const amount = parseFloat($('amount').value);
    const description = $('desc').value.trim() || $('desc').placeholder.replace('اكتب الوصف...', '').trim();
    if (!amount) { status('err', 'اكتب المبلغ'); $('amount').focus(); return; }
    if (!description) { status('err', 'اكتب صرفته في إيه'); $('desc').focus(); return; }
    if (!$('date').value) { status('err', 'اختار التاريخ'); return; }

    saving = true;
    $('done').disabled = $('cancel').disabled = true;
    status('info', 'بيسجل في الشيت...<span class="spin"></span>');
    const t = type;

    api('rcpt_save', {
        sheetName: $('sheet').value,
        date: $('date').value,
        amount, type: t, description,
        url: item.res.url, fileId: item.res.fileId,
      })
      .then(r => {
        saving = false;
        item.state = 'saved';
        item.saved = { row: r.row, sheet: r.sheet, amount: (t === 'in' ? '+' : '-') + amount };
        next();
        if (cur !== -1) {
          const msg = `✅ اتسجل الإيصال اللي فات في صف ${r.row}`;
          const s = $('status'); if (queue[cur].state !== 'ready') return;
          s.innerHTML = msg + ' — ' + s.innerHTML;
        }
      })
      .catch(err => {
        saving = false;
        $('done').disabled = $('cancel').disabled = false;
        status('err', '❌ ' + err.message);
      });
  }

  function finishAll() {
    const saved = queue.filter(q => q.state === 'saved');
    $('form').style.display = 'none';
    $('preview').style.display = 'none';
    $('progress').style.display = 'none';
    renderStrip();
    status('ok', saved.length
      ? `✅ خلصنا — اتسجل ${saved.length} إيصال (صفوف ${saved.map(q => q.saved.row).join('، ')}) 👇 ارفع اللي بعدهم`
      : 'مفيش حاجة اتسجلت');
    queue = []; cur = -1;
    setTimeout(() => { $('strip').style.display = 'none'; }, 0);
    drop.style.display = 'block';
  }

  function status(kind, html) { const s = $('status'); s.className = 'status ' + kind; s.innerHTML = html; }
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
</script>
</body>
</html>
